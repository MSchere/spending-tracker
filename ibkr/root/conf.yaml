ip2loc: "US"
proxyRemoteSsl: true
proxyRemoteHost: "https://api.ibkr.com"
listenPort: 5000
listenSsl: true
ccp: false
svcEnvironment: "v1"
sslCert: "vertx.jks"
sslPwd: "mywebapi"
authDelay: 3000
portalBaseURL: ""
serverOptions:
  blockedThreadCheckInterval: 1000000
  eventLoopPoolSize: 20
  workerPoolSize: 20
  maxWorkerExecuteTime: 100
  internalBlockingPoolSize: 20
cors:
  origin.allowed: "*"
  allowCredentials: false
webApps:
  - name: "demo"
    index: "index.html"
ips:
  allow:
    - 127.0.0.1
    - ::1
    # Docker bridge networks (app container -> gateway). Docker defaults to
    # 172.x; if your host's docker pool ever lands on 10.x, add it back here.
    - 172.*
    # Your admin machine only — replace with the actual LAN IP you log in from
    - 192.168.10.20
  deny:
    - 212.90.324.10
