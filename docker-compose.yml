services:
  migrate:
    build:
      context: .
      target: migrator
    user: "1001:1001"
    environment:
      HOME: /tmp
      DATABASE_URL: file:/app/data/spending.db
    volumes:
      - ${DATA_DIR:-/var/lib/spending-tracker/data}:/app/data
    restart: "no"

  app:
    build:
      context: .
      target: runner
    depends_on:
      migrate:
        condition: service_completed_successfully
      ibkr-gateway:
        condition: service_started
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      TZ: ${TZ:-Europe/Madrid}
      DATABASE_URL: file:/app/data/spending.db
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      AUTH_TRUST_HOST: ${AUTH_TRUST_HOST:-true}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?set NEXTAUTH_SECRET in .env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env}
      WISE_API_TOKEN: ${WISE_API_TOKEN:?set WISE_API_TOKEN in .env}
      WISE_ENVIRONMENT: ${WISE_ENVIRONMENT:-production}
      INDEXA_API_TOKEN: ${INDEXA_API_TOKEN:-}
      INDEXA_USERNAME: ${INDEXA_USERNAME:-}
      INDEXA_PASSWORD: ${INDEXA_PASSWORD:-}
      INDEXA_DOCUMENT: ${INDEXA_DOCUMENT:-}
      ALPHA_VANTAGE_API_KEY: ${ALPHA_VANTAGE_API_KEY:-}
      IBKR_GATEWAY_URL: https://ibkr-gateway:5000
      # Browser-facing URL for re-login links (e.g. https://192.168.10.150:5000)
      IBKR_GATEWAY_PUBLIC_URL: ${IBKR_GATEWAY_PUBLIC_URL:-}
    volumes:
      - ${DATA_DIR:-/var/lib/spending-tracker/data}:/app/data
    restart: unless-stopped

  ibkr-gateway:
    build:
      context: ./ibkr
    ports:
      - "${IBKR_PORT:-5000}:5000"
    volumes:
      - ibkr-logs:/gateway/logs
    healthcheck:
      # TCP probe: the gateway only starts listening after Java/vertx boots
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/5000'"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  # Headless auto-login for the gateway (IBKR's SSO flow only accepts
  # localhost origins, so this runs with host networking). Reads
  # IBKR_USERNAME/IBKR_PASSWORD from the agenix secrets file; the only manual
  # step is tapping the IB Key push on your phone. See scripts/ibkr-login/.
  ibkr-login:
    build: ./scripts/ibkr-login
    depends_on:
      ibkr-gateway:
        condition: service_healthy
    network_mode: host
    environment:
      GATEWAY_URL: https://localhost:5000
      SECRETS_FILE: ${IBKR_LOGIN_SECRETS_FILE:-/run/agenix/spending-tracker}
      CHECK_INTERVAL_MIN: ${IBKR_LOGIN_CHECK_INTERVAL_MIN:-10}
    volumes:
      - ${IBKR_LOGIN_SECRETS_FILE:-/run/agenix/spending-tracker}:/run/agenix/spending-tracker:ro
    restart: unless-stopped

volumes:
  ibkr-logs:
